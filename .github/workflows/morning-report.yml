name: Morning Report

on:
  schedule:
    # Laeuft taeglich um 05:00 UTC = 07:00 MESZ (Sommerzeit) bzw. 06:00 MEZ (Winterzeit)
    - cron: '0 5 * * *'
  # Ermoeglicht manuelles Starten zum Testen (Tab "Actions" -> "Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Report generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_report.py

      - name: index.html und Archiv committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reports/
          git diff --cached --quiet && echo "Keine Aenderungen" || git commit -m "Automatisches Update: Morning Report"
          git push
